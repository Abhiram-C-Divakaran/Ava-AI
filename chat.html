    messagesEl.appendChild(row);

    attachCodeCopyListeners(block);

    if (messageId) {
      block.querySelectorAll('.feedback-btn').forEach(btn => {
        btn.addEventListener('click', () => sendFeedback(btn.dataset.mid, btn.dataset.helpful === 'true', btn));
      });
    }
    block.querySelector('.agent-copy-btn').addEventListener('click', () => copyText(text, block.querySelector('.agent-copy-btn')));
    block.querySelector('.agent-share-btn').addEventListener('click', () => shareText(text, block.querySelector('.agent-share-btn')));

    scrollToBottom();
  }

  async function sendFeedback(messageId, helpful, btn) {
    btn.classList.add('selected');
    try {
      await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userData.user_id, session_id: currentSessionId, message_id: messageId, helpful }),
      });
    } catch(err) { console.error(err); }
  }

  // ─── Special commands ───────────────────────────────────────────
  async function handleSpecialCommand(text) {
    if (text.startsWith('/ppt')) {
      let parts = text.slice(5).trim().split(' ');
      let slides = 5, topic = parts.join(' ');
      const slideMatch = topic.match(/\s+(\d+)$/);
      if (slideMatch) { slides = parseInt(slideMatch[1]); topic = topic.slice(0, -slideMatch[0].length).trim(); }
      if (!topic) topic = 'Presentation';
      appendUserMessage(text);
      showTyping();
      try {
        const res = await fetch('/api/generate-ppt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: userData.user_id, topic, slides }) });
        if (!res.ok) throw new Error('PPT generation failed');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `${topic.replace(/[^a-z0-9]/gi, '_')}.pptx`; a.click();
        URL.revokeObjectURL(url);
        appendAgentMessage(`✅ PowerPoint presentation on "${topic}" with ${slides} slides is ready.`, null, null);
      } catch (err) { appendAgentMessage(`❌ Failed to generate PPT: ${err.message}`, null, null); }
      hideTyping(); return true;
    }
    else if (text.startsWith('/img')) {
      const prompt = text.slice(5).trim();
      if (!prompt) { appendAgentMessage('Please provide an image description after /img', null, null); return true; }
      appendUserMessage(text); showTyping();
      try {
        const res = await fetch('/api/generate-image', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: userData.user_id, prompt }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Image generation failed');
        appendAgentMessage(`![Generated image](${data.image_url})\n\n*${prompt}*`, null, null);
      } catch (err) { appendAgentMessage(`❌ Failed to generate image: ${err.message}`, null, null); }
      hideTyping(); return true;
    }
    else if (text.startsWith('/search')) {
      const query = text.slice(8).trim();
      if (!query) { appendAgentMessage('Please provide a search query after /search', null, null); return true; }
      appendUserMessage(text); showTyping();
      try {
        const res = await fetch(`/api/web-search?query=${encodeURIComponent(query)}`);
        const data = await res.json();
        let md = `**Search results for "${escapeHtml(query)}":**\n\n`;
        if (data.results && data.results.length > 0) {
          data.results.forEach(r => { md += `**[${r.title}](${r.url})**\n${r.snippet}\n\n`; });
        } else { md = 'No results found.'; }
        appendAgentMessage(md, null, null);
      } catch (err) { appendAgentMessage(`❌ Search failed: ${err.message}`, null, null); }
      hideTyping(); return true;
    }
    return false;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row agent'; row.id = 'typing-row';
    row.innerHTML = `<div class="agent-block"><div class="bubble typing"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(row);
    scrollToBottom();
  }
  function hideTyping() { const row = document.getElementById('typing-row'); if (row) row.remove(); }

  // ─── Attachment system ──────────────────────────────────────────
  const attachBtn = document.getElementById('attach-btn');
  const fileInput = document.getElementById('file-input');
  const attachmentsBar = document.getElementById('attachments-bar');
  let pendingAttachments = [];

  function renderAttachmentsBar() {
    attachmentsBar.innerHTML = '';
    pendingAttachments.forEach((att, idx) => {
      const chip = document.createElement('div');
      chip.className = 'attach-chip' + (att.type === 'image' ? ' is-image' : '');
      if (att.type === 'image' && att.dataUrl)
        chip.innerHTML = `<img class="attach-chip-thumb" src="${att.dataUrl}"><span class="attach-chip-name">${att.name}</span><button class="attach-chip-remove" data-idx="${idx}">✕</button>`;
      else
        chip.innerHTML = `<span class="attach-chip-icon">${fileIcon(att.name)}</span><span class="attach-chip-name">${att.name}</span><button class="attach-chip-remove" data-idx="${idx}">✕</button>`;
      chip.querySelector('.attach-chip-remove').addEventListener('click', () => { pendingAttachments.splice(idx, 1); renderAttachmentsBar(); });
      attachmentsBar.appendChild(chip);
    });
    attachmentsBar.classList.toggle('has-items', pendingAttachments.length > 0);
  }

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async () => {
    const files = Array.from(fileInput.files);
    fileInput.value = '';
    for (const file of files) {
      const ext = file.name.split('.').pop().toLowerCase();
      const isImage = ['png','jpg','jpeg','gif','webp','bmp'].includes(ext);
      if (isImage) {
        const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
        pendingAttachments.push({ type: 'image', name: file.name, dataUrl, mimeType: file.type });
        renderAttachmentsBar();
      } else {
        const form = new FormData();
        form.append('user_id', userData.user_id);
        form.append('file', file);
        pendingAttachments.push({ type: 'doc', name: file.name, extractedText: '', _uploading: true });
        renderAttachmentsBar();
        try {
          const res = await fetch('/api/upload-document', { method: 'POST', body: form });
          const data = await res.json();
          const idx = pendingAttachments.findIndex(a => a.name === file.name && a._uploading);
          if (idx >= 0) {
            pendingAttachments[idx] = { type: 'doc', name: file.name, docId: data.doc_id, extractedText: data.text_preview || '' };
            renderAttachmentsBar();
          }
        } catch(e) { console.error('Upload error', e); }
      }
    }
  });

  // ─── Stop generation ───────────────────────────────────────────
  function setStreaming(isStreaming) {
    sendBtn.disabled = isStreaming;
    sendBtn.style.display = isStreaming ? 'none' : 'flex';
    stopBtn.style.display = isStreaming ? 'flex' : 'none';
    stopBtn.classList.toggle('visible', isStreaming);
  }

  stopBtn.addEventListener('click', () => {
    if (abortController) {
      abortController.abort();
      abortController = null;
    }
    setStreaming(false);
  });

  // ─── Streaming sendMessage ──────────────────────────────────────
  async function sendMessage() {
    const text = input.value.trim();
    if (!text && pendingAttachments.length === 0) return;
    if (abortController) return;

    errorBanner.style.display = 'none';
    input.value = '';
    updateCharCount();
    input.style.height = 'auto';

    const isCommand = text && await handleSpecialCommand(text);
    if (isCommand) return;

    const attachments = [...pendingAttachments];
    pendingAttachments = [];
    renderAttachmentsBar();

    appendUserMessage(text, attachments, new Date());

    const agentRow = document.createElement('div');
    agentRow.className = 'row agent';
    agentRow.innerHTML = `<div class="agent-block"><div class="bubble md-rendered" id="streaming-bubble"></div><div class="meta-badges"></div></div>`;
    messagesEl.appendChild(agentRow);
    const bubbleEl = agentRow.querySelector('.bubble');

    const cursor = document.createElement('span');
    cursor.className = 'streaming-cursor';
    bubbleEl.appendChild(cursor);

    let fullResponse = '';
    let messageId = null;
    let sessionId = currentSessionId;

    const modeToggle = document.getElementById('mode-toggle');
    const isDetailed = modeToggle.classList.contains('active');
    const mode = isDetailed ? 'detailed' : 'flash';
    console.log('🔍 [Frontend] Sending mode:', mode);

    const webSearchActive = document.getElementById('search-toggle').classList.contains('active');

    setStreaming(true);
    abortController = new AbortController();

    try {
      const payload = {
        user_id: userData.user_id,
        message: text || ' ',
        session_id: sessionId,
        mode: mode,
        web_search: webSearchActive,
      };
      const imgAtt = attachments.find(a => a.type === 'image');
      const docAtt = attachments.find(a => a.type === 'doc');
      if (imgAtt && imgAtt.dataUrl) {
        payload.image_base64 = imgAtt.dataUrl.split(',')[1];
        payload.image_mime = imgAtt.mimeType || 'image/jpeg';
        payload.file_name = imgAtt.name;
      }
      if (docAtt) {
        payload.file_context = docAtt.extractedText || '';
        payload.file_name = docAtt.name;
        if (docAtt.docId) payload.doc_id = docAtt.docId;
      }

      const res = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: abortController.signal,
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const data = JSON.parse(line.slice(6));
              if (data.chunk) {
                fullResponse += data.chunk;
                cursor.remove();
                bubbleEl.innerHTML = renderMarkdown(fullResponse);
                attachCodeCopyListeners(bubbleEl);
                bubbleEl.appendChild(cursor);
                scrollToBottom();
              } else if (data.status) {
                cursor.remove();
                bubbleEl.innerHTML = `<span class="status-pulse">${data.status}</span>`;
                bubbleEl.appendChild(cursor);
                scrollToBottom();
              } else if (data.done) {
                cursor.remove();
                messageId = data.message_id;
                sessionId = data.session_id;
                currentSessionId = sessionId;

                bubbleEl.innerHTML = renderMarkdown(fullResponse);
                attachCodeCopyListeners(bubbleEl);

                const metaDiv = agentRow.querySelector('.meta-badges');
                if (data.metadata) {
                  if (data.metadata.intent) metaDiv.innerHTML += `<span class="badge">${data.metadata.intent.replace(/_/g, ' ')}</span>`;
                  if (data.metadata.sentiment?.label) metaDiv.innerHTML += `<span class="badge sentiment-${data.metadata.sentiment.label}">${data.metadata.sentiment.label} sentiment</span>`;
                  if (typeof data.metadata.frustration_score === 'number') metaDiv.innerHTML += `<span class="badge">frustration ${Math.round(data.metadata.frustration_score*100)}%</span>`;
                }

                const block = agentRow.querySelector('.agent-block');
                const timeStr = formatTime(new Date());

                if (messageId) {
                  const feedbackRow = document.createElement('div');
                  feedbackRow.className = 'feedback-row';
                  feedbackRow.innerHTML = `
                    <button class="feedback-btn" data-mid="${messageId}" data-helpful="true">👍</button>
                    <button class="feedback-btn" data-mid="${messageId}" data-helpful="false">👎</button>
                  `;
                  block.appendChild(feedbackRow);
                  feedbackRow.querySelectorAll('.feedback-btn').forEach(btn => {
                    btn.addEventListener('click', () => sendFeedback(btn.dataset.mid, btn.dataset.helpful === 'true', btn));
                  });
                }

                const actionsRow = document.createElement('div');
                actionsRow.className = 'msg-actions';
                actionsRow.innerHTML = `
                  <span class="msg-time">${timeStr}</span>
                  <button class="msg-action-btn s-copy-btn" title="Copy">${ICON_COPY}</button>
                  <button class="msg-action-btn s-share-btn" title="Share">${ICON_SHARE}</button>
                `;
                block.appendChild(actionsRow);
                actionsRow.querySelector('.s-copy-btn').addEventListener('click', function(){ copyText(fullResponse, this); });
                actionsRow.querySelector('.s-share-btn').addEventListener('click', function(){ shareText(fullResponse, this); });

                loadSessions();
              }
            } catch (e) { console.warn('Error parsing stream data', e); }
          }
        }
      }
    } catch (err) {
      cursor.remove();
      if (err.name !== 'AbortError') {
        bubbleEl.innerHTML = renderMarkdown(`❌ Error: ${err.message}`);
      } else {
        if (fullResponse) {
          bubbleEl.innerHTML = renderMarkdown(fullResponse + '\n\n*[Generation stopped]*');
          attachCodeCopyListeners(bubbleEl);
        } else {
          bubbleEl.innerHTML = '<em style="color:var(--muted)">Generation stopped.</em>';
        }
      }
    } finally {
      abortController = null;
      setStreaming(false);
      scrollToBottom();
    }
  }

  // ─── Suggestions ─────────────────────────────────────────────────
  let suggestionTimeout;
  input.addEventListener('input', async () => {
    clearTimeout(suggestionTimeout);
    suggestionTimeout = setTimeout(async () => {
      const text = input.value.trim();
      if (text.length < 2) { removeSuggestions(); return; }
      try {
        const res = await fetch('/api/suggestions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userData.user_id, current_input: text }),
        });
        const data = await res.json();
        showSuggestions(data.suggestions);
      } catch(e) { console.error(e); }
    }, 300);
  });

  function showSuggestions(suggestions) {
    removeSuggestions();
    if (!suggestions.length) return;
    const box = document.createElement('div');
    box.className = 'suggestion-box';
    suggestions.forEach(s => {
      const chip = document.createElement('span');
      chip.className = 'suggestion-chip';
      chip.textContent = s;
      chip.onclick = () => { input.value = s; sendMessage(); removeSuggestions(); };
      box.appendChild(chip);
    });
    document.querySelector('.composer-inner').after(box);
  }
  function removeSuggestions() { const box = document.querySelector('.suggestion-box'); if (box) box.remove(); }

  function escapeHtml(str) {
    if (typeof str !== 'string') return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
  }

  // ─── Voice input ────────────────────────────────────────────────
  const micBtn = document.getElementById('mic-btn');
  let isRecording = false;
  let mediaRecorder = null;
  let audioChunks = [];
  let recognition = null;
  let usingSpeechAPI = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function setMicRecording(active) {
    isRecording = active;
    micBtn.classList.toggle('recording', active);
    micBtn.title = active ? 'Recording… click to stop' : 'Voice input';
    input.placeholder = active ? '🎙️ Listening…' : 'Message Ava…';
  }

  function showMicError(msg) {
    const cc = document.getElementById('char-count');
    if (cc) {
      cc.textContent = '⚠️ ' + msg;
      cc.classList.add('warn');
      setTimeout(() => { 
        if (!isRecording) {
          cc.textContent = ''; 
          cc.classList.remove('warn');
        }
      }, 5000);
    }
    const banner = document.getElementById('error-banner');
    if (banner) {
      banner.textContent = '🎤 ' + msg;
      banner.style.display = 'block';
      setTimeout(() => { banner.style.display = 'none'; }, 5000);
    }
  }

  // ── Path A: Web Speech API ──────────────────────────────────────
  function startSpeechAPI() {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';
    let finalTranscript = '';
    const inputBefore = input.value;

    recognition.onstart = () => {
      setMicRecording(true);
      console.log('🎤 Speech recognition started');
    };

    recognition.onresult = (e) => {
      let interim = '';
      finalTranscript = '';
      for (let i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      const displayText = (inputBefore ? inputBefore + ' ' : '') + finalTranscript + interim;
      input.value = displayText;
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
      updateCharCount();
    };

    recognition.onend = () => {
      setMicRecording(false);
      console.log('🎤 Speech recognition ended');
      const combined = ((inputBefore ? inputBefore + ' ' : '') + finalTranscript).trim();
      if (combined) {
        input.value = combined;
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        updateCharCount();
        if (combined.length > 3) {
          setTimeout(() => {
            if (input.value.trim()) {
              sendMessage();
            }
          }, 500);
        }
      }
    };

    recognition.onerror = (e) => {
      console.error('🎤 Speech recognition error:', e.error);
      setMicRecording(false);
      if (e.error === 'not-allowed') {
        showMicError('Mic access denied — allow mic in browser settings');
      } else if (e.error === 'network') {
        showMicError('Speech API needs internet — try again or use the microphone button');
      } else if (e.error === 'no-speech') {
        showMicError('No speech detected — try speaking louder or click again');
      } else {
        showMicError(`Speech error: ${e.error} — click the mic to try again`);
      }
    };

    try {
      recognition.start();
    } catch(err) {
      console.error('Failed to start speech recognition:', err);
      showMicError('Could not start voice input — trying alternate method');
      usingSpeechAPI = false;
      startMediaRecorder();
    }
  }

  function stopSpeechAPI() {
    if (recognition) { 
      try { 
        recognition.stop(); 
        console.log('🎤 Speech recognition stopped');
      } catch(e) { 
        console.warn('Error stopping speech:', e); 
      } 
    }
  }

  // ── Path B: MediaRecorder → Whisper ──────────────────────────────
  async function startMediaRecorder() {
    try {
      console.log('🎤 Starting MediaRecorder for voice input');
      const stream = await navigator.mediaDevices.getUserMedia({ 
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
      
      let mimeType = 'audio/webm;codecs=opus';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'audio/webm';
      }
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'audio/ogg;codecs=opus';
      }
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = 'audio/mp4';
      }
      
      console.log('🎤 Using MIME type:', mimeType);
      
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream, { 
        mimeType,
        audioBitsPerSecond: 128000
      });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        setMicRecording(false);
        console.log('🎤 Recording stopped, chunks:', audioChunks.length);

        if (audioChunks.length === 0) {
          showMicError('No audio recorded — try again');
          return;
        }
        
        const blob = new Blob(audioChunks, { type: mimeType });
        console.log('🎤 Audio blob size:', blob.size, 'bytes');

        input.placeholder = '⏳ Transcribing…';
        micBtn.style.opacity = '0.5';
        micBtn.disabled = true;

        try {
          const formData = new FormData();
          const ext = mimeType.includes('webm') ? 'webm' : 
                     mimeType.includes('ogg') ? 'ogg' : 
                     mimeType.includes('mp4') ? 'm4a' : 'webm';
          formData.append('audio', blob, `recording.${ext}`);
          
          console.log('🎤 Sending to transcription API...');
          const res = await fetch('/api/transcribe', { 
            method: 'POST', 
            body: formData,
            signal: AbortSignal.timeout(30000)
          });
          
          if (!res.ok) {
            const errorText = await res.text();
            console.error('Transcription API error:', res.status, errorText);
            throw new Error(`Transcription API error: ${res.status} - ${errorText}`);
          }
          
          const data = await res.json();
          console.log('🎤 Transcription result:', data);
          
          if (data.text && data.text.trim()) {
            const transcribedText = data.text.trim();
            const prev = input.value.trim();
            input.value = prev ? prev + ' ' + transcribedText : transcribedText;
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            updateCharCount();
            input.focus();
            
            if (transcribedText.length > 2) {
              setTimeout(() => {
                if (input.value.trim()) {
                  sendMessage();
                }
              }, 300);
            }
          } else {
            showMicError('Could not transcribe audio — try speaking more clearly');
          }
        } catch(err) {
          console.error('Transcription error:', err);
          if (err.name === 'AbortError' || err.name === 'TimeoutError') {
            showMicError('Transcription timed out — check your internet connection');
          } else {
            showMicError(`Transcription failed: ${err.message}`);
          }
        } finally {
          input.placeholder = 'Message Ava…';
          micBtn.style.opacity = '';
          micBtn.disabled = false;
          audioChunks = [];
        }
      };

      mediaRecorder.start(1000);
      setMicRecording(true);
      console.log('🎤 MediaRecorder started successfully');
      
    } catch(err) {
      console.error('MediaRecorder error:', err);
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        showMicError('Mic access denied — click the 🔒 in your address bar and allow microphone access');
      } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
        showMicError('No microphone found — connect a microphone and try again');
      } else {
        showMicError(`Mic error: ${err.message}`);
      }
      setMicRecording(false);
    }
  }

  function stopMediaRecorder() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      try {
        mediaRecorder.stop();
        console.log('🎤 MediaRecorder stopped');
      } catch(e) {
        console.warn('Error stopping recorder:', e);
      }
    }
  }

  // ── Mic button click ─────────────────────────────────────────────
  micBtn.addEventListener('click', async () => {
    if (isRecording) {
      console.log('🎤 Stopping recording...');
      if (usingSpeechAPI) {
        stopSpeechAPI();
      } else {
        stopMediaRecorder();
      }
      return;
    }

    try {
      const permissionStatus = await navigator.permissions.query({ name: 'microphone' });
      console.log('🎤 Mic permission status:', permissionStatus.state);
      
      if (permissionStatus.state === 'denied') {
        showMicError('Microphone access denied — please enable in browser settings');
        return;
      }
    } catch(e) {
      console.log('Permissions API not available, continuing...');
    }

    if (SpeechRecognition && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      console.log('🎤 Using Web Speech API');
      usingSpeechAPI = true;
      startSpeechAPI();
    } else {
      console.log('🎤 Using MediaRecorder + Whisper API');
      usingSpeechAPI = false;
      await startMediaRecorder();
    }
  });

  // ─── Event listeners ────────────────────────────────────────────
  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // ─── Initial load ───────────────────────────────────────────────
  loadSessions();

  console.log('🚀 Ava AI Chat loaded successfully');
  console.log('🎤 Voice input: Click the mic button and speak');
  console.log('📝 Mode:', localStorage.getItem('ava-mode') || 'flash');
  console.log('🎨 Theme:', localStorage.getItem('ava-theme') || 'light');
</script>
