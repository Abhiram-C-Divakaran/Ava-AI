<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ava AI — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  /* ─── Variables (light/dark) ────────────────────────────────── */
  :root {
    --bg-deep: #1B1664;
    --bg-mid: #2A1F8C;
    --bg-darker: #15104D;
    --bg-footer: #100C3A;
    --panel-dark: #2E2796;
    --panel-light: #3A3299;
    --cyan: #54E6F2;
    --violet: #7C6CF6;
    --text-light: #F5F4FF;
    --text-dim: rgba(245,244,255,0.70);
    --text-dimmer: rgba(245,244,255,0.45);
    --border-dark: rgba(255,255,255,0.10);
    --purple-deep: #1B1664;
    --purple-darker: #15104D;
    --purple-mid: #2A1F8C;
    --purple-light: #7C6CF6;
    --lavender: #f1e4ff;
    --lavender-deep: #e3cdfb;
    --ink: #1d1230;
    --muted: #cbb9e8;
    --bg: #fdfbff;
    --panel: #ffffff;
    --border: #ece2fb;
    --pos: #3aa97a;
    --neu: #9a8db8;
    --neg: #d96a6a;
    --sidebar-bg: #13104A;
    --sidebar-text: #fff;
    --sidebar-text-dim: rgba(255,255,255,0.7);
    --sidebar-hover: rgba(255,255,255,0.06);
    --sidebar-active: rgba(255,255,255,0.08);
    --composer-bg: var(--panel);
    --composer-border: var(--border);
    --input-text: var(--ink);
    --topbar-border: var(--border);
    --bubble-agent-bg: var(--panel);
    --bubble-agent-border: var(--border);
    --bubble-agent-text: var(--ink);
    --bubble-user-bg: linear-gradient(120deg, var(--cyan), var(--violet));
    --bubble-user-text: #0E0B3A;
    --accent: var(--cyan);
  }

  body.dark-mode {
    --bg: #12121e;
    --panel: #1e1e32;
    --border: #2a2a44;
    --ink: #ececf5;
    --muted: #8888aa;
    --pos: #5ccb9a;
    --neu: #a8a0c0;
    --neg: #e88080;
    --sidebar-bg: #0d0d18;
    --sidebar-text: #ececf5;
    --sidebar-text-dim: rgba(236,236,245,0.6);
    --sidebar-hover: rgba(255,255,255,0.05);
    --sidebar-active: rgba(255,255,255,0.08);
    --composer-bg: var(--panel);
    --composer-border: var(--border);
    --input-text: var(--ink);
    --topbar-border: var(--border);
    --bubble-agent-bg: var(--panel);
    --bubble-agent-border: var(--border);
    --bubble-agent-text: var(--ink);
    --bubble-user-bg: linear-gradient(120deg, var(--cyan), var(--violet));
    --bubble-user-text: #0E0B3A;
    --bg-deep: #0d0d18;
    --bg-mid: #1a1a30;
    --bg-darker: #0a0a12;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
    transition: background 0.25s, color 0.25s;
  }

  .app { display: flex; height: 100vh; transition: all 0.25s; }

  /* ─── Sidebar ─────────────────────────────────────────────────── */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    border-right: 1px solid rgba(255,255,255,0.06);
    transition: width 0.3s ease, opacity 0.25s ease, margin 0.3s ease;
    overflow: hidden;
    position: relative;
    z-index: 10;
  }

  .app.sidebar-hidden .sidebar {
    width: 0;
    padding: 0;
    margin: 0;
    border: none;
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .brand {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    padding: 4px 10px 14px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .brand-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-icon svg { width: 28px; height: 28px; }
  .brand span { color: var(--cyan); }

  .new-chat {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.10);
    color: var(--sidebar-text);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    margin-bottom: 16px;
    font-size: 0.9rem;
    font-weight: 500;
    transition: background 0.15s;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .new-chat:hover { background: rgba(255,255,255,0.15); border-color: rgba(84,230,242,0.3); }
  .new-chat .plus { font-weight: 700; font-size: 1.2rem; line-height: 1; }

  .sessions-container {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 4px;
  }
  .sessions-container::-webkit-scrollbar { width: 4px; }
  .sessions-container::-webkit-scrollbar-track { background: transparent; }
  .sessions-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

  .session-group { display: flex; flex-direction: column; gap: 2px; }
  .session-group-header {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--sidebar-text-dim);
    opacity: 0.5;
    padding: 8px 10px 4px;
  }
  .session-item-wrapper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 6px;
    padding: 2px 4px 2px 2px;
    cursor: pointer;
    position: relative;
  }
  .session-item-wrapper:hover { background: var(--sidebar-hover); }
  .session-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--sidebar-text-dim);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    font-weight: 400;
    transition: color 0.1s;
  }
  .session-item-wrapper:hover .session-item { color: var(--sidebar-text); }
  .session-item.active, .session-item-wrapper .session-item.active {
    background: var(--sidebar-active);
    color: var(--sidebar-text);
    font-weight: 500;
  }
  .session-item-wrapper.active { background: var(--sidebar-active); }

  .session-dropdown-trigger {
    background: none;
    border: none;
    color: rgba(255,255,255,0.3);
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .session-item-wrapper:hover .session-dropdown-trigger { opacity: 1; }
  .session-dropdown-trigger:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .session-dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 100%;
    background: #2A1F8C;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    min-width: 130px;
    padding: 4px 0;
    z-index: 100;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .session-dropdown.show { display: block; }
  .session-dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: rgba(255,255,255,0.85);
    padding: 6px 16px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: inherit;
  }
  .session-dropdown button:hover { background: rgba(255,255,255,0.10); color: #fff; }
  .session-dropdown .dropdown-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 4px 8px; }
  .session-dropdown .delete-option { color: #ff8a8a; }
  .session-dropdown .delete-option:hover { background: rgba(255,0,0,0.15); }

  .user-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 8px 4px;
    border-top: 1px solid rgba(255,255,255,0.06);
    margin-top: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .user-row:hover { background: rgba(255,255,255,0.04); border-radius: 8px; }
  .user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(120deg, var(--cyan), var(--violet));
    color: var(--bg-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    flex-shrink: 0;
    overflow: hidden;
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--sidebar-text); }
  .logout-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 4px 6px;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
    font-family: inherit;
  }
  .logout-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

  /* ─── Main chat area ──────────────────────────────────────────── */
  .main { flex: 1; display: flex; flex-direction: column; height: 100vh; background: var(--bg); min-width: 0; }

  /* ─── Minimal Topbar ──────────────────────────────────────────── */
  .topbar {
    padding: 12px 20px;
    border-bottom: 1px solid var(--topbar-border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg);
    flex-shrink: 0;
    transition: background 0.25s, border-color 0.25s;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .sidebar-toggle {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    transition: background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .sidebar-toggle:hover { background: var(--border); color: var(--ink); }
  .topbar h1 {
    font-family: 'Sora', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .topbar-spacer { flex: 1; }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .theme-toggle, .mode-toggle {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--muted);
    transition: all 0.15s;
    line-height: 1;
    font-family: inherit;
    white-space: nowrap;
  }
  .theme-toggle:hover, .mode-toggle:hover {
    background: var(--border);
    border-color: var(--violet);
    color: var(--ink);
  }
  .mode-toggle.active {
    border-color: var(--violet);
    background: rgba(124,108,246,0.12);
    color: var(--purple-light);
  }

  /* ─── Messages ────────────────────────────────────────────────── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 8% 12px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    background: var(--bg);
    transition: background 0.25s;
  }

  /* ─── Chat rows ────────────────────────────────────────────────── */
  .row {
    display: flex;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 4px 0;
  }

  .row.user { justify-content: flex-end; }
  .row.agent { justify-content: flex-start; }

  /* ─── User Message ───────────────────────────────────────────── */
  .user-message-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    max-width: 75%;
    gap: 6px;
  }

  .user-message-container .bubble {
    background: var(--bubble-user-bg);
    color: var(--bubble-user-text);
    border-radius: 18px 18px 4px 18px;
    padding: 14px 20px;
    font-size: 0.96rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-wrap: break-word;
    width: 100%;
    box-shadow: 0 2px 8px rgba(124, 108, 246, 0.15);
  }

  /* ─── Agent Message ───────────────────────────────────────────── */
  .agent-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 100%;
    width: 100%;
  }

  .agent-block .bubble {
    background: var(--bubble-agent-bg);
    border: 1px solid var(--bubble-agent-border);
    color: var(--bubble-agent-text);
    border-radius: 18px 18px 18px 4px;
    padding: 16px 22px;
    font-size: 0.96rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-wrap: break-word;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  /* ─── Message Actions (Copy, Edit, Share) ────────────────────── */
  .msg-actions {
    display: flex;
    gap: 6px;
    padding: 4px 8px;
    align-items: center;
  }

  /* ─── Time Stamp ───────────────────────────────────────────────── */
  .msg-time {
    font-size: 0.7rem;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.2s;
    padding: 2px 6px;
    white-space: nowrap;
  }
  .row:hover .msg-time { opacity: 0.7; }

  /* ─── Badges ──────────────────────────────────────────────────── */
  .meta-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
    padding: 0 4px;
  }

  .badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 12px;
    border-radius: 999px;
    background: rgba(124,108,246,0.12);
    color: var(--purple-mid);
    border: none;
  }
  body.dark-mode .badge { background: rgba(124,108,246,0.25); color: #b8a8ff; }
  .badge.sentiment-positive { background: #e3f6ec; color: var(--pos); }
  .badge.sentiment-neutral { background: #ece9f6; color: var(--neu); }
  .badge.sentiment-negative { background: #fbe8e8; color: var(--neg); }
  body.dark-mode .badge.sentiment-positive { background: #1a4a3a; color: #7cdbb0; }
  body.dark-mode .badge.sentiment-neutral { background: #2a2a4a; color: #b8b0d0; }
  body.dark-mode .badge.sentiment-negative { background: #4a1a1a; color: #f0a0a0; }

  /* ─── Markdown Rendering ──────────────────────────────────────── */
  .bubble.md-rendered { white-space: normal; }
  .bubble.md-rendered p { 
    margin: 0 0 12px; 
    line-height: 1.7;
  }
  .bubble.md-rendered p:last-child { margin-bottom: 0; }
  .bubble.md-rendered h1, .bubble.md-rendered h2, .bubble.md-rendered h3 {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    margin: 16px 0 8px;
    color: var(--ink);
    line-height: 1.3;
  }
  .bubble.md-rendered h1 { font-size: 1.3rem; }
  .bubble.md-rendered h2 { font-size: 1.1rem; }
  .bubble.md-rendered h3 { font-size: 0.98rem; }
  .bubble.md-rendered ul, .bubble.md-rendered ol {
    padding-left: 24px;
    margin: 8px 0 12px;
  }
  .bubble.md-rendered li { margin: 6px 0; line-height: 1.7; }
  .bubble.md-rendered strong { font-weight: 700; color: var(--ink); }
  .bubble.md-rendered em { font-style: italic; }
  .bubble.md-rendered a { color: var(--violet); text-decoration: underline; }
  .bubble.md-rendered a:hover { color: var(--cyan); }
  .bubble.md-rendered blockquote {
    border-left: 3px solid var(--violet);
    margin: 12px 0;
    padding: 8px 16px;
    background: rgba(124,108,246,0.07);
    border-radius: 0 8px 8px 0;
    color: var(--muted);
    font-style: italic;
  }
  .bubble.md-rendered hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }
  .bubble.md-rendered table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0;
    font-size: 0.88rem;
  }
  .bubble.md-rendered th, .bubble.md-rendered td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  .bubble.md-rendered th { background: rgba(124,108,246,0.1); font-weight: 600; }
  .bubble.md-rendered tr:nth-child(even) td { background: rgba(124,108,246,0.04); }

  /* ─── Code Blocks ──────────────────────────────────────────────── */
  .code-block-wrap {
    position: relative;
    margin: 12px 0;
    border-radius: 10px;
    overflow: hidden;
    background: #1a1b26;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .code-lang {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.4);
    text-transform: lowercase;
    letter-spacing: 0.03em;
  }
  .code-copy-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.45);
    font-size: 0.75rem;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: inherit;
    transition: color 0.15s, background 0.15s;
  }
  .code-copy-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .code-copy-btn.copied { color: var(--pos); }
  .code-block-wrap pre {
    margin: 0 !important;
    padding: 14px 18px !important;
    overflow-x: auto;
    background: transparent !important;
  }
  .code-block-wrap pre code {
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 0.82rem !important;
    line-height: 1.6 !important;
    background: transparent !important;
    padding: 0 !important;
  }

  /* ─── Feedback Buttons ────────────────────────────────────────── */
  .feedback-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    padding: 0 4px;
  }
  .feedback-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.85rem;
    transition: all 0.15s;
  }
  .feedback-btn:hover { color: var(--purple-light); border-color: var(--violet); }
  .feedback-btn.selected { border-color: var(--violet); background: rgba(124,108,246,0.12); color: var(--purple-mid); }

  /* ─── Small Action Buttons ────────────────────────────────────── */
  .msg-action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    font-size: 0.85rem;
    line-height: 1;
  }
  .msg-action-btn:hover {
    background: var(--border);
    color: var(--violet);
  }
  .msg-action-btn.copied { color: var(--pos); }
  .msg-action-btn svg { display: block; }

  /* ─── Typing Indicator ────────────────────────────────────────── */
  .typing { 
    display: flex; 
    gap: 6px; 
    padding: 12px 0; 
  }
  .typing span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 
    0%,60%,100%{transform:translateY(0); opacity:0.5;} 
    30%{transform:translateY(-6px); opacity:1;} 
  }

  /* ─── Edit Mode ────────────────────────────────────────────────── */
  .edit-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .edit-wrap .edit-area {
    width: 100%;
    box-sizing: border-box;
    border: 1.5px solid var(--violet);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 0.96rem;
    line-height: 1.6;
    font-family: inherit;
    color: var(--ink);
    background: var(--panel);
    resize: none;
    overflow: hidden;
    outline: none;
    min-height: 160px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .edit-wrap .edit-area:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(84,230,242,0.12);
  }
  .edit-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .edit-actions .edit-cancel-btn,
  .edit-actions .edit-save-btn {
    border: none;
    border-radius: 6px;
    padding: 6px 16px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, color 0.2s;
  }
  .edit-actions .edit-cancel-btn {
    background: none;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .edit-actions .edit-cancel-btn:hover {
    border-color: var(--violet);
    color: var(--violet);
  }
  .edit-actions .edit-save-btn {
    background: linear-gradient(120deg, var(--cyan), var(--violet));
    color: #0E0B3A;
  }
  .edit-actions .edit-save-btn:hover {
    box-shadow: 0 4px 12px -4px rgba(84,230,242,0.4);
  }

  /* ─── Empty State ────────────────────────────────────────────── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    padding: 20px;
    min-height: 300px;
  }
  .empty-state .greeting {
    font-family: 'Sora', sans-serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .empty-state .greeting .highlight {
    background: linear-gradient(120deg, var(--cyan), var(--violet));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .empty-state .sub {
    font-size: 1rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .empty-state .sub code {
    background: var(--border);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.8rem;
  }

  /* ─── Composer ────────────────────────────────────────────────── */
  .composer {
    padding: 14px 8% 22px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    transition: background 0.25s, border-color 0.25s;
    flex-shrink: 0;
  }
  .composer-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--composer-bg);
    border: 1px solid var(--composer-border);
    border-radius: 40px;
    padding: 6px 6px 6px 20px;
    transition: background 0.25s, border-color 0.25s;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .composer textarea {
    flex: 1;
    border: none;
    resize: none;
    font-family: inherit;
    font-size: 0.96rem;
    padding: 10px 0;
    background: transparent;
    color: var(--input-text);
    transition: color 0.25s;
    min-height: 44px;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .composer textarea:focus { outline: none; }

  .send-btn {
    background: linear-gradient(120deg, var(--cyan), var(--violet));
    color: #0E0B3A;
    border: none;
    border-radius: 30px;
    padding: 8px 20px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px -4px rgba(84,230,242,0.5);
  }
  .send-btn:disabled { opacity: 0.4; cursor: default; }

  .attach-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 8px 4px;
    font-size: 1.1rem;
    transition: color 0.2s;
    flex-shrink: 0;
    line-height: 1;
  }
  .attach-btn:hover { color: var(--violet); }

  .mic-btn {
    background: none; border: none; cursor: pointer;
    font-size: 1.1rem; padding: 6px; border-radius: 8px;
    color: var(--muted); line-height: 1; flex-shrink: 0;
    transition: color 0.15s, background 0.15s, transform 0.15s;
    position: relative;
  }
  .mic-btn:hover { color: var(--violet); }
  .mic-btn.recording {
    color: #e84b4b;
    animation: mic-pulse 1s ease-in-out infinite;
  }
  .mic-btn.recording::after {
    content: '';
    position: absolute; inset: -3px;
    border-radius: 50%;
    border: 2px solid #e84b4b;
    opacity: 0.5;
    animation: mic-ring 1s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  @keyframes mic-ring {
    0% { transform: scale(0.9); opacity: 0.6; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  .stop-btn {
    background: none;
    border: 1px solid var(--neg);
    color: var(--neg);
    border-radius: 30px;
    padding: 8px 20px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, transform 0.15s;
    white-space: nowrap;
    display: none;
    align-items: center;
    gap: 6px;
  }
  .stop-btn.visible { display: flex; }
  .stop-btn:hover { background: rgba(217,106,106,0.1); transform: translateY(-1px); }

  /* ─── Composer Meta ───────────────────────────────────────────── */
  .composer-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 760px;
    margin: 4px auto 0;
    padding: 0 20px;
    font-size: 0.73rem;
    color: var(--muted);
    opacity: 0.7;
  }
  .composer-meta .char-count.warn { color: var(--neg); }
  .composer-meta .kbd { display: inline-flex; gap: 4px; }
  .composer-meta kbd {
    background: var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 0.7rem;
    font-family: inherit;
  }

  /* ─── Attachments ─────────────────────────────────────────────── */
  .attachments-bar { display: none; flex-wrap: wrap; gap: 8px; padding: 10px 20px 4px; max-width: 760px; margin: 0 auto; }
  .attachments-bar.has-items { display: flex; }
  .attach-chip { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; background: rgba(124,108,246,0.15); border: 1px solid rgba(124,108,246,0.35); border-radius: 20px; font-size: 0.8rem; color: var(--ink); max-width: 220px; }
  .attach-chip.is-image { padding: 4px 10px 4px 4px; }
  .attach-chip-icon { font-size: 0.95rem; flex-shrink: 0; }
  .attach-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .attach-chip-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 0 0 0 2px; line-height: 1; flex-shrink: 0; transition: color 0.15s; }
  .attach-chip-remove:hover { color: var(--neg); }
  .attach-chip-thumb { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
  .bubble-attachment { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .bubble-attachment img { max-width: 240px; max-height: 200px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(124,108,246,0.25); display: block; }
  .doc-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--muted); background: rgba(124,108,246,0.08); padding: 4px 10px; border-radius: 10px; border: 1px solid rgba(124,108,246,0.15); }

  /* ─── Suggestion Box ──────────────────────────────────────────── */
  .suggestion-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 8px auto 0;
    padding: 6px;
    max-width: 760px;
    transition: background 0.25s, border-color 0.25s;
  }
  .suggestion-chip {
    display: inline-block;
    background: rgba(124,108,246,0.12);
    color: var(--purple-mid);
    border-radius: 16px;
    padding: 5px 14px;
    margin: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.15s;
  }
  .suggestion-chip:hover { background: rgba(124,108,246,0.22); }

  /* ─── Error Banner ────────────────────────────────────────────── */
  .error-banner {
    max-width: 760px;
    margin: 0 auto 10px;
    background: #fbe8e8;
    color: var(--neg);
    border-radius: 10px;
    padding: 10px 14px;
    display: none;
    font-size: 0.88rem;
  }

  /* ─── Prompt Starters ─────────────────────────────────────────── */
  .starters-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    max-width: 780px;
    width: 100%;
    margin-top: 28px;
  }
  @media (max-width: 700px) {
    .starters-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 480px) {
    .starters-grid { grid-template-columns: 1fr; }
  }
  .starter-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .starter-card:hover {
    border-color: var(--violet);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px -6px rgba(124,108,246,0.2);
  }
  .starter-icon { font-size: 1.2rem; }
  .starter-title { font-size: 0.85rem; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .starter-sub { font-size: 0.77rem; color: var(--muted); }

  /* ─── Streaming Cursor ────────────────────────────────────────── */
  .streaming-cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--violet);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.9s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ─── Status Pulse ────────────────────────────────────────────── */
  .status-pulse {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    color: var(--muted);
    font-style: italic;
    animation: status-fade 0.8s ease-in-out infinite alternate;
  }
  .status-pulse::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--violet);
    animation: status-dot 0.8s ease-in-out infinite alternate;
    flex-shrink: 0;
  }
  @keyframes status-fade { from { opacity: 0.5; } to { opacity: 1; } }
  @keyframes status-dot {
    from { transform: scale(0.7); background: var(--violet); }
    to { transform: scale(1.2); background: var(--cyan); }
  }

  /* ─── Search Toggle ───────────────────────────────────────────── */
  .search-toggle-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--muted);
    transition: all 0.15s;
    line-height: 1;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .search-toggle-btn:hover { background: var(--border); color: var(--ink); }
  .search-toggle-btn.active {
    border-color: var(--cyan);
    background: rgba(84,230,242,0.1);
    color: #0097A7;
  }
  body.dark-mode .search-toggle-btn.active { color: var(--cyan); }
  .search-toggle-btn .search-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.15s;
  }
  .search-toggle-btn.active .search-dot { background: var(--cyan); }

  /* ─── Modals ───────────────────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: #fff;
    border-radius: 28px;
    width: 100%; max-width: 400px;
    max-height: 92vh;
    overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;
    box-shadow: 0 24px 60px rgba(0,0,0,0.18);
  }
  body.dark-mode .modal-card { background: #1e1b2e; }
  .modal-card::-webkit-scrollbar { display: none; }

  .modal-header {
    padding: 18px 20px 0;
    display: flex; align-items: center;
  }
  .modal-back {
    background: #f0f0f0; border: none; border-radius: 50%;
    width: 34px; height: 34px; font-size: 1.4rem; line-height: 1;
    cursor: pointer; color: #555;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  body.dark-mode .modal-back { background: rgba(255,255,255,0.1); color: #fff; }
  .modal-back:hover { background: #e0e0e0; }
  body.dark-mode .modal-back:hover { background: rgba(255,255,255,0.18); }

  .modal-body { padding: 16px 28px 32px; display: flex; flex-direction: column; gap: 0; }

  /* ─── Rename Modal ────────────────────────────────────────────── */
  .rename-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 16, 50, 0.55);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
  }
  .rename-overlay.open { display: flex; }
  .rename-card {
    background: var(--panel);
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    padding: 28px 32px 24px;
    box-shadow: 0 40px 80px -30px rgba(27,22,100,0.45);
    text-align: center;
  }
  .rename-card h3 { font-family: 'Sora', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--ink); margin-bottom: 16px; }
  .rename-card input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--ink);
    background: var(--bg);
    margin-bottom: 18px;
    transition: border-color 0.2s;
  }
  .rename-card input:focus { outline: none; border-color: var(--violet); }
  .rename-actions { display: flex; gap: 12px; justify-content: center; }
  .rename-actions .btn-secondary, .rename-actions .btn-primary-modal { min-width: 80px; padding: 9px 20px; }

  /* ─── Responsive ───────────────────────────────────────────────── */
  @media (max-width: 760px) {
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      z-index: 100;
      box-shadow: 2px 0 20px rgba(0,0,0,0.3);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }
    .app.sidebar-visible .sidebar { transform: translateX(0); }
    .app.sidebar-hidden .sidebar { width: 280px; padding: 16px 12px; opacity: 1; pointer-events: auto; transform: translateX(-100%); }
    .app.sidebar-visible .sidebar { transform: translateX(0); }
    .modal-body { padding: 24px 20px; }
    .rename-card { padding: 20px; }
    .composer-inner { border-radius: 30px; padding: 4px 4px 4px 16px; }
    .send-btn { padding: 6px 16px; font-size: 0.8rem; }
    .messages { padding: 16px 4% 8px; gap: 16px; }
    .row { padding: 2px 0; }
    .user-message-container { max-width: 85%; }
    .agent-block .bubble { padding: 12px 16px; }
    .user-message-container .bubble { padding: 10px 16px; }
  }
  @media (min-width: 761px) {
    .app.sidebar-hidden .sidebar { width: 0; padding: 0; margin: 0; border: none; opacity: 0; pointer-events: none; overflow: hidden; }
  }
</style>
</head>
<body>
<div class="app sidebar-hidden" id="app">
  <!-- ─── Sidebar ─── -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-icon">
        <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#54E6F2"/><stop offset="100%" stop-color="#7C6CF6"/></linearGradient></defs>
          <circle cx="30" cy="15" r="14" fill="url(#cyanGrad)"/>
          <circle cx="45" cy="40" r="14" fill="#54E6F2" opacity="0.85"/>
          <circle cx="15" cy="40" r="14" fill="#7C6CF6" opacity="0.85"/>
        </svg>
      </span>
      Ava<span>AI</span>
    </div>
    <button class="new-chat" id="new-chat"><span class="plus">+</span> New chat</button>
    <div class="sessions-container" id="sessions-container"></div>
    <div class="user-row" id="user-row">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info"><div class="user-name" id="user-name">—</div></div>
      <button class="logout-btn" id="logout">Logout</button>
    </div>
  </aside>

  <!-- ─── Main chat area ─── -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
        <h1>Ava</h1>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-actions">
        <button class="search-toggle-btn" id="search-toggle" title="Toggle web search"><span class="search-dot"></span> Web Search</button>
        <button class="mode-toggle" id="mode-toggle" aria-label="Toggle response mode">⚡ Flash</button>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="greeting">The mic is yours, <span class="highlight" id="greeting-name">Abhiram</span></div>
        <div class="sub">Ask Ava anything — <span id="greeting-hint">I'm here to help</span></div>
        <div class="starters-grid" id="starters-grid">
          <button class="starter-card" data-prompt="/run python\nprint('Hello from Ava!')\nfor i in range(5):\n    print(f'  {i**2}')">
            <span class="starter-icon">⚙️</span>
            <span class="starter-title">Run code live</span>
            <span class="starter-sub">/run python — real execution</span>
          </button>
          <button class="starter-card" data-prompt="Translate 'Good morning, how are you today?' to Japanese">
            <span class="starter-icon">🌐</span>
            <span class="starter-title">Translate text</span>
            <span class="starter-sub">Powered by DeepL</span>
          </button>
          <button class="starter-card" data-prompt="What are the latest AI breakthroughs this week?">
            <span class="starter-icon">🔍</span>
            <span class="starter-title">Live web search</span>
            <span class="starter-sub">Real-time internet results</span>
          </button>
          <button class="starter-card" data-prompt="Write a Python function that reads a CSV and returns column statistics">
            <span class="starter-icon">🐍</span>
            <span class="starter-title">Code & data</span>
            <span class="starter-sub">Write, debug, analyse</span>
          </button>
          <button class="starter-card" data-prompt="Summarise the key points of a long article or document I paste below">
            <span class="starter-icon">📋</span>
            <span class="starter-title">Summarise content</span>
            <span class="starter-sub">Condense any text</span>
          </button>
          <button class="starter-card" data-prompt="What can you do? Show me your full capabilities.">
            <span class="starter-icon">🤖</span>
            <span class="starter-title">What can Ava do?</span>
            <span class="starter-sub">Full capabilities tour</span>
          </button>
        </div>
      </div>
    </div>
    <div class="composer">
      <div class="error-banner" id="error-banner"></div>
      <div class="attachments-bar" id="attachments-bar"></div>
      <div class="composer-inner">
        <button class="attach-btn" id="attach-btn" title="Attach image or document" type="button">📎</button>
        <button class="mic-btn" id="mic-btn" title="Voice input" type="button">🎙️</button>
        <textarea id="input" placeholder="Message Ava…" rows="1"></textarea>
        <button class="stop-btn" id="stop-btn">⏹ Stop</button>
        <button class="send-btn" id="send-btn">Ask Ava</button>
      </div>
      <div class="composer-meta">
        <span class="char-count" id="char-count"></span>
        <span class="kbd"><kbd>Shift</kbd>+<kbd>Enter</kbd> for new line</span>
      </div>
      <input type="file" id="file-input" accept="image/*,.pdf,.doc,.docx,.xlsx,.xls,.pptx,.csv,.tsv,.txt,.md" style="display:none" multiple>
    </div>
  </main>
</div>

<!-- ─── Modals ──────────────────────────────────────────────────────── -->
<!-- Profile Modal -->
<div class="modal-overlay" id="profile-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <button class="modal-back" id="profile-close" aria-label="Close">‹</button>
    </div>
    <div class="modal-body">
      <!-- Avatar -->
      <div class="profile-avatar-wrap">
        <div class="profile-photo" id="avatar-preview">?</div>
        <button class="avatar-edit-badge" id="avatar-upload-btn" type="button" title="Change photo">✎</button>
        <input type="file" id="avatar-input" accept="image/*" style="display:none;">
      </div>

      <!-- Fields -->
      <div class="profile-fields">
        <div class="field-row">
          <label>First Name</label>
          <input type="text" id="profile-name" placeholder="Your name">
        </div>
        <div class="field-row">
          <label>Last Name</label>
          <input type="text" id="profile-lastname" placeholder="Last name">
        </div>
        <div class="field-row">
          <label>Email</label>
          <input type="email" id="profile-email" placeholder="you@example.com" disabled>
        </div>
        <div class="field-row field-row-arrow" id="birth-row">
          <label>Birth</label>
          <span class="field-arrow">›</span>
        </div>
        <div class="field-row field-row-arrow" id="gender-row">
          <label>Gender</label>
          <span class="field-arrow">›</span>
        </div>
      </div>

      <!-- Change Password button -->
      <button class="profile-pw-btn" id="password-toggle" type="button">
        🔒 Change Password
      </button>
      <div class="password-fields" id="password-fields" style="display:none;">
        <div class="field-row"><label>Current Password</label><input type="password" id="current-password" placeholder="Enter current password"></div>
        <div class="field-row"><label>New Password</label><input type="password" id="new-password" placeholder="Min 6 chars"></div>
        <div class="field-row"><label>Confirm New Password</label><input type="password" id="confirm-password" placeholder="Confirm new password"></div>
        <button class="profile-pw-update-btn" id="change-password-btn" type="button">Update Password</button>
        <div id="password-status" style="font-size:0.85rem;margin-top:6px;display:none;"></div>
      </div>

      <!-- Hidden prefs (kept for backend) -->
      <div style="display:none;">
        <textarea id="custom-instructions"></textarea>
        <select id="personality-select">
          <option value="friendly">Friendly</option>
          <option value="professional">Professional</option>
          <option value="technical">Technical</option>
          <option value="creative">Creative</option>
        </select>
      </div>

      <!-- Memory section (collapsed, accessible via a subtle link) -->
      <div class="memory-section">
        <button class="memory-toggle" id="memory-toggle" type="button" aria-expanded="false">
          <span class="memory-toggle-left">
            <span class="memory-orb" id="memory-orb"><span class="memory-orb-core"></span></span>
            <span class="memory-toggle-text">
              <span class="memory-toggle-title">What Ava remembers</span>
              <span class="memory-toggle-sub" id="memory-toggle-sub">Loading…</span>
            </span>
          </span>
          <svg class="memory-chevron" id="memory-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="memory-panel" id="memory-panel">
          <div class="memory-panel-inner">
            <div class="memory-empty" id="memory-empty">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M12 2a5 5 0 00-5 5c0 1.5.6 2.4 1.3 3.2.5.6.9 1.1.9 2v1a1 1 0 001 1h3.6a1 1 0 001-1v-1c0-.9.4-1.4.9-2A5.4 5.4 0 0017 7a5 5 0 00-5-5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.5 17.5h5M10 20h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <p>Ava hasn't picked up on anything yet. Keep chatting — useful context will appear here automatically.</p>
            </div>
            <ul class="memory-list" id="memory-list"></ul>
            <div class="memory-actions">
              <span class="memory-updated" id="memory-updated"></span>
              <button class="memory-clear-btn" id="memory-clear-btn" type="button">Forget everything</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Logout -->
      <button class="profile-logout-btn" id="profile-logout-btn" type="button">
        Logout ⏻
      </button>

      <!-- Save (hidden but keeps JS working) -->
      <button id="profile-save" type="button" style="display:none;"></button>
      <button id="profile-cancel" type="button" style="display:none;"></button>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div class="rename-overlay" id="rename-overlay">
  <div class="rename-card">
    <h3>Rename Chat</h3>
    <input type="text" id="rename-input" placeholder="Enter new title" />
    <div class="rename-actions">
      <button class="btn-secondary" id="rename-cancel">Cancel</button>
      <button class="btn-primary-modal" id="rename-save">Save</button>
    </div>
  </div>
</div>

<script>
  // ─── marked.js config ─────────────────────────────────────────
  marked.setOptions({
    breaks: true,
    gfm: true,
    highlight: null,
  });

  // Custom renderer: wrap code blocks
  const renderer = new marked.Renderer();
  renderer.code = function(code, lang) {
    const language = lang || 'plaintext';
    let highlighted;
    try {
      highlighted = hljs.highlight(code, { language, ignoreIllegals: true }).value;
    } catch(e) {
      highlighted = hljs.highlightAuto(code).value;
    }
    const safeId = 'cb_' + Math.random().toString(36).slice(2);
    return `<div class="code-block-wrap">
      <div class="code-block-header">
        <span class="code-lang">${language}</span>
        <button class="code-copy-btn" data-target="${safeId}">Copy</button>
      </div>
      <pre><code id="${safeId}" class="hljs language-${language}">${highlighted}</code></pre>
    </div>`;
  };
  marked.use({ renderer });

  function renderMarkdown(text) {
    return marked.parse(text);
  }

  function attachCodeCopyListeners(el) {
    el.querySelectorAll('.code-copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        if (!target) return;
        navigator.clipboard.writeText(target.innerText).then(() => {
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
        });
      });
    });
  }

  // ─── Theme & Mode toggles ──────────────────────────────────────
  (function initUI() {
    const savedTheme = localStorage.getItem('ava-theme') || 'light';
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      document.getElementById('theme-toggle').textContent = '☀️';
    }
    const savedMode = localStorage.getItem('ava-mode') || 'flash';
    const modeToggle = document.getElementById('mode-toggle');
    modeToggle.textContent = savedMode === 'flash' ? '⚡ Flash' : '🔬 Detailed';
    if (savedMode === 'detailed') modeToggle.classList.add('active');

    // Web search toggle
    const searchToggle = document.getElementById('search-toggle');
    const savedSearch = localStorage.getItem('ava-search') === 'true';
    if (savedSearch) searchToggle.classList.add('active');
  })();

  document.getElementById('theme-toggle').addEventListener('click', function() {
    const isDark = document.body.classList.toggle('dark-mode');
    this.textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('ava-theme', isDark ? 'dark' : 'light');
  });

  document.getElementById('mode-toggle').addEventListener('click', function() {
    const isDetailed = this.classList.toggle('active');
    this.textContent = isDetailed ? '🔬 Detailed' : '⚡ Flash';
    localStorage.setItem('ava-mode', isDetailed ? 'detailed' : 'flash');
  });

  document.getElementById('search-toggle').addEventListener('click', function() {
    const isActive = this.classList.toggle('active');
    localStorage.setItem('ava-search', isActive ? 'true' : 'false');
  });

  // ─── Sidebar toggle ─────────────────────────────────────────────
  const app = document.getElementById('app');
  const sidebarToggle = document.getElementById('sidebar-toggle');
  if (!localStorage.getItem('ava-sidebar')) {
    localStorage.setItem('ava-sidebar', 'hidden');
  }
  const sidebarState = localStorage.getItem('ava-sidebar') || 'hidden';
  if (sidebarState === 'hidden') app.classList.add('sidebar-hidden');

  sidebarToggle.addEventListener('click', function() {
    const isHidden = app.classList.toggle('sidebar-hidden');
    localStorage.setItem('ava-sidebar', isHidden ? 'hidden' : 'visible');
    if (window.innerWidth <= 760) app.classList.toggle('sidebar-visible', !isHidden);
  });

  document.addEventListener('click', function(e) {
    if (window.innerWidth <= 760) {
      const sidebar = document.getElementById('sidebar');
      const toggle = document.getElementById('sidebar-toggle');
      if (app.classList.contains('sidebar-visible') && !sidebar.contains(e.target) && !toggle.contains(e.target)) {
        app.classList.remove('sidebar-visible');
      }
    }
  });

  let lastWidth = window.innerWidth;
  window.addEventListener('resize', function() {
    const newWidth = window.innerWidth;
    if (lastWidth <= 760 && newWidth > 760) {
      app.classList.remove('sidebar-visible');
      if (localStorage.getItem('ava-sidebar') === 'hidden') app.classList.add('sidebar-hidden');
      else app.classList.remove('sidebar-hidden');
    }
    lastWidth = newWidth;
  });

  // ─── Global user data ──────────────────────────────────────────
  const userData = JSON.parse(localStorage.getItem('neurosupport_user') || 'null');
  if (!userData) { console.warn('No user data, redirecting to login'); window.location.href = 'auth.html?mode=login'; }

  // ─── DOM references ────────────────────────────────────────────
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('empty-state');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const stopBtn = document.getElementById('stop-btn');
  const sessionsContainer = document.getElementById('sessions-container');
  const errorBanner = document.getElementById('error-banner');
  const charCount = document.getElementById('char-count');
  let currentSessionId = null;
  let abortController = null;

  function renderAvatar() {
    const el = document.getElementById('user-avatar');
    if (userData.avatar) el.innerHTML = `<img src="${userData.avatar}" alt="Profile photo">`;
    else el.textContent = (userData.name || '?')[0].toUpperCase();
  }
  document.getElementById('user-name').textContent = userData.name;
  renderAvatar();

  // FIXED: Use the user's name from localStorage
  const greetingName = document.getElementById('greeting-name');
  if (userData.name) greetingName.textContent = userData.name;

  document.getElementById('logout').addEventListener('click', () => {
    localStorage.removeItem('neurosupport_user');
    window.location.href = 'auth.html?mode=login';
  });

  // ─── Prompt starters ──────────────────────────────────────────
  document.getElementById('starters-grid').addEventListener('click', (e) => {
    const card = e.target.closest('.starter-card');
    if (!card) return;
    input.value = card.dataset.prompt;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    updateCharCount();
    input.focus();
    sendMessage();
  });

  // ─── Char counter ──────────────────────────────────────────────
  function updateCharCount() {
    const len = input.value.length;
    if (len > 0) {
      charCount.textContent = `${len.toLocaleString()} chars`;
      charCount.classList.toggle('warn', len > 3000);
    } else {
      charCount.textContent = '';
    }
  }
  input.addEventListener('input', updateCharCount);

  // ─── Profile modal logic ──────────────────────────────────────
  const profileOverlay = document.getElementById('profile-overlay');
  const avatarPreview = document.getElementById('avatar-preview');
  const avatarInput = document.getElementById('avatar-input');
  const profileNameInput = document.getElementById('profile-name');
  const profileEmailInput = document.getElementById('profile-email');
  const customInstructionsInput = document.getElementById('custom-instructions');
  const personalitySelect = document.getElementById('personality-select');
  const currentPwInput = document.getElementById('current-password');
  const newPwInput = document.getElementById('new-password');
  const confirmPwInput = document.getElementById('confirm-password');
  const passwordStatus = document.getElementById('password-status');
  let pendingAvatar = userData.avatar || null;

  const renameOverlay = document.getElementById('rename-overlay');
  const renameInput = document.getElementById('rename-input');
  const renameSaveBtn = document.getElementById('rename-save');
  const renameCancelBtn = document.getElementById('rename-cancel');
  let pendingRenameSessionId = null;
  let pendingRenameCurrentTitle = '';

  document.getElementById('password-toggle').addEventListener('click', function() {
    const fields = document.getElementById('password-fields');
    const isHidden = fields.style.display === 'none';
    fields.style.display = isHidden ? 'flex' : 'none';
    this.textContent = isHidden ? 'Hide Password Change' : '🔒 Change Password';
  });

  function renderAvatarPreview() {
    if (pendingAvatar) avatarPreview.innerHTML = `<img src="${pendingAvatar}" alt="Profile photo">`;
    else avatarPreview.textContent = (profileNameInput.value || userData.name || '?')[0].toUpperCase();
  }

  async function loadPreferences() {
    try {
      const res = await fetch(`/api/user/preferences/${userData.user_id}`);
      if (!res.ok) throw new Error('Failed to load preferences');
      const data = await res.json();
      customInstructionsInput.value = data.custom_instructions || '';
      personalitySelect.value = data.personality || 'friendly';
    } catch (err) { console.error(err); }
  }

  // ─── Memory section ──────────────────────────────────────────
  const memoryToggle = document.getElementById('memory-toggle');
  const memoryPanel = document.getElementById('memory-panel');
  const memoryToggleSub = document.getElementById('memory-toggle-sub');
  const memoryEmpty = document.getElementById('memory-empty');
  const memoryList = document.getElementById('memory-list');
  const memoryUpdated = document.getElementById('memory-updated');
  const memoryClearBtn = document.getElementById('memory-clear-btn');
  const memoryOrb = document.getElementById('memory-orb');

  function parseMemoryFacts(text) {
    if (!text) return [];
    return text.split('\n').map(line => line.replace(/^[\s•\-\*]+/, '').trim()).filter(Boolean);
  }

  function renderMemory(memoryText, updatedAt) {
    const facts = parseMemoryFacts(memoryText);
    memoryList.innerHTML = '';
    if (facts.length === 0) {
      memoryEmpty.style.display = 'flex';
      memoryToggleSub.textContent = 'Nothing remembered yet';
      memoryOrb.style.opacity = '0.45';
    } else {
      memoryEmpty.style.display = 'none';
      memoryOrb.style.opacity = '1';
      facts.forEach((fact, i) => {
        const li = document.createElement('li');
        li.textContent = fact;
        li.style.setProperty('--mi-delay', `${i * 0.06}s`);
        memoryList.appendChild(li);
      });
      memoryToggleSub.textContent = facts.length === 1 ? '1 thing remembered' : `${facts.length} things remembered`;
    }
    if (updatedAt) {
      const d = new Date(updatedAt);
      memoryUpdated.textContent = isNaN(d) ? '' : `Updated ${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
    } else {
      memoryUpdated.textContent = '';
    }
    memoryClearBtn.disabled = facts.length === 0;
  }

  async function loadMemory() {
    memoryToggleSub.textContent = 'Loading…';
    try {
      const res = await fetch(`/api/user-memory/${userData.user_id}`);
      if (!res.ok) throw new Error('Failed to load memory');
      const data = await res.json();
      renderMemory(data.memory_text, data.updated_at);
    } catch (err) {
      console.error(err);
      memoryToggleSub.textContent = 'Unavailable right now';
    }
  }

  memoryToggle.addEventListener('click', () => {
    const isOpen = memoryPanel.classList.toggle('open');
    memoryToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });

  memoryClearBtn.addEventListener('click', async () => {
    if (memoryClearBtn.disabled) return;
    const confirmed = confirm("Forget everything Ava remembers about you from past conversations? This won't delete your chat history.");
    if (!confirmed) return;
    memoryClearBtn.disabled = true;
    memoryClearBtn.textContent = 'Forgetting…';
    try {
      await fetch(`/api/user-memory/${userData.user_id}`, { method: 'DELETE' });
      renderMemory('', null);
    } catch (err) { console.error(err); }
    memoryClearBtn.textContent = 'Forget everything';
  });

  function openProfileModal() {
    profileNameInput.value = userData.name || '';
    profileEmailInput.value = userData.email || '';
    pendingAvatar = userData.avatar || null;
    renderAvatarPreview();
    loadPreferences();
    currentPwInput.value = '';
    newPwInput.value = '';
    confirmPwInput.value = '';
    passwordStatus.style.display = 'none';
    document.getElementById('password-fields').style.display = 'none';
    document.getElementById('password-toggle').textContent = '🔒 Change Password';
    memoryPanel.classList.remove('open');
    memoryToggle.setAttribute('aria-expanded', 'false');
    loadMemory();
    profileOverlay.classList.add('open');
  }
  function closeProfileModal() { profileOverlay.classList.remove('open'); }

  document.getElementById('user-row').addEventListener('click', (e) => {
    if (e.target.closest('#logout')) return;
    openProfileModal();
  });
  document.getElementById('profile-close').addEventListener('click', closeProfileModal);
  document.getElementById('profile-cancel').addEventListener('click', closeProfileModal);
  profileOverlay.addEventListener('click', (e) => { if (e.target === profileOverlay) closeProfileModal(); });

  document.getElementById('profile-logout-btn').addEventListener('click', () => {
    localStorage.removeItem('neurosupport_user');
    window.location.href = 'auth.html?mode=login';
  });

  document.getElementById('avatar-upload-btn').addEventListener('click', () => avatarInput.click());
  avatarInput.addEventListener('change', () => {
    const file = avatarInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { pendingAvatar = reader.result; renderAvatarPreview(); };
    reader.readAsDataURL(file);
  });
  profileNameInput.addEventListener('input', () => { if (!pendingAvatar) renderAvatarPreview(); });

  document.getElementById('change-password-btn').addEventListener('click', async () => {
    const current = currentPwInput.value;
    const newPw = newPwInput.value;
    const confirm = confirmPwInput.value;
    if (!current || !newPw || !confirm) {
      passwordStatus.textContent = 'Please fill in all password fields.';
      passwordStatus.style.color = 'var(--neg)';
      passwordStatus.style.display = 'block';
      return;
    }
    if (newPw.length < 6) {
      passwordStatus.textContent = 'New password must be at least 6 characters.';
      passwordStatus.style.color = 'var(--neg)';
      passwordStatus.style.display = 'block';
      return;
    }
    if (newPw !== confirm) {
      passwordStatus.textContent = 'New passwords do not match.';
      passwordStatus.style.color = 'var(--neg)';
      passwordStatus.style.display = 'block';
      return;
    }
    try {
      const res = await fetch(`/api/user/password/${userData.user_id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_password: current, new_password: newPw })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Password change failed');
      passwordStatus.textContent = '✅ Password updated successfully!';
      passwordStatus.style.color = 'var(--pos)';
      passwordStatus.style.display = 'block';
      currentPwInput.value = ''; newPwInput.value = ''; confirmPwInput.value = '';
    } catch (err) {
      passwordStatus.textContent = '❌ ' + err.message;
      passwordStatus.style.color = 'var(--neg)';
      passwordStatus.style.display = 'block';
    }
  });

  document.getElementById('profile-save').addEventListener('click', async () => {
    const newName = profileNameInput.value.trim();
    if (newName) { userData.name = newName; greetingName.textContent = newName; }
    userData.avatar = pendingAvatar;
    localStorage.setItem('neurosupport_user', JSON.stringify(userData));
    document.getElementById('user-name').textContent = userData.name;
    renderAvatar();
    const prefs = { custom_instructions: customInstructionsInput.value, personality: personalitySelect.value, theme: 'light' };
    try {
      await fetch(`/api/user/preferences/${userData.user_id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(prefs)
      });
    } catch (err) { console.error(err); }
    closeProfileModal();
  });

  // ─── New chat ────────────────────────────────────────────────────
  document.getElementById('new-chat').addEventListener('click', () => {
    currentSessionId = null;
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    highlightSession(null);
    input.focus();
    if (window.innerWidth <= 760) app.classList.remove('sidebar-visible');
  });

  // ─── Rename modal ───────────────────────────────────────────────
  function openRenameModal(sessionId, currentTitle) {
    pendingRenameSessionId = sessionId;
    pendingRenameCurrentTitle = currentTitle;
    renameInput.value = currentTitle;
    renameOverlay.classList.add('open');
    renameInput.focus();
    renameInput.select();
  }
  function closeRenameModal() {
    renameOverlay.classList.remove('open');
    pendingRenameSessionId = null;
    pendingRenameCurrentTitle = '';
  }
  renameCancelBtn.addEventListener('click', closeRenameModal);
  renameOverlay.addEventListener('click', (e) => { if (e.target === renameOverlay) closeRenameModal(); });
  renameSaveBtn.addEventListener('click', async () => {
    const newTitle = renameInput.value.trim();
    if (!newTitle) { alert('Title cannot be empty.'); return; }
    if (newTitle === pendingRenameCurrentTitle) { closeRenameModal(); return; }
    try {
      const res = await fetch(`/api/sessions/${userData.user_id}/${pendingRenameSessionId}/rename`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ new_title: newTitle })
      });
      if (!res.ok) throw new Error(`Rename failed: ${res.status}`);
      closeRenameModal();
      await loadSessions();
    } catch (err) {
      console.error(err);
      alert(`❌ Could not rename chat: ${err.message}`);
      closeRenameModal();
    }
  });
  renameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); renameSaveBtn.click(); }
    if (e.key === 'Escape') closeRenameModal();
  });

  // ─── Delete session ─────────────────────────────────────────────
  async function deleteSession(sessionId) {
    try {
      const res = await fetch(`/api/sessions/${userData.user_id}/${sessionId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('Delete failed');
      if (currentSessionId === sessionId) {
        currentSessionId = null;
        messagesEl.innerHTML = '';
        messagesEl.appendChild(emptyState);
        highlightSession(null);
      }
      await loadSessions();
    } catch (err) {
      console.error(err);
      alert('Could not delete conversation');
    }
  }

  // ─── Date grouping ──────────────────────────────────────────────
  function groupSessionsByDate(sessions) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
    const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate() - 7);
    const groups = { 'Today': [], 'Yesterday': [], 'Last 7 Days': [], 'Older': [] };
    sessions.forEach(s => {
      const created = new Date(s.created_at);
      const createdDate = new Date(created.getFullYear(), created.getMonth(), created.getDate());
      if (createdDate.getTime() === today.getTime()) groups['Today'].push(s);
      else if (createdDate.getTime() === yesterday.getTime()) groups['Yesterday'].push(s);
      else if (createdDate.getTime() >= weekAgo.getTime()) groups['Last 7 Days'].push(s);
      else groups['Older'].push(s);
    });
    for (let key in groups) groups[key].sort((a, b) => new Date(b.last_active) - new Date(a.last_active));
    return groups;
  }

  // ─── Load sessions ──────────────────────────────────────────────
  async function loadSessions() {
    try {
      const res = await fetch(`/api/sessions/${userData.user_id}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      sessionsContainer.innerHTML = '';
      if (!data.sessions || data.sessions.length === 0) {
        sessionsContainer.innerHTML = '<div style="color:rgba(255,255,255,0.4);font-size:0.85rem;padding:10px;">No conversations yet</div>';
        return;
      }
      const groups = groupSessionsByDate(data.sessions);
      for (const [groupName, sessions] of Object.entries(groups)) {
        if (sessions.length === 0) continue;
        const groupDiv = document.createElement('div');
        groupDiv.className = 'session-group';
        const header = document.createElement('div');
        header.className = 'session-group-header';
        header.textContent = groupName;
        groupDiv.appendChild(header);
        sessions.forEach(s => {
          const wrapper = document.createElement('div');
          wrapper.className = 'session-item-wrapper';
          if (currentSessionId === s.session_id) wrapper.classList.add('active');
          wrapper.dataset.sessionId = s.session_id;
          const btn = document.createElement('button');
          btn.className = 'session-item';
          btn.textContent = s.title || s.first_message || 'New conversation';
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openSession(s.session_id);
            document.querySelectorAll('.session-dropdown.show').forEach(d => d.classList.remove('show'));
            if (window.innerWidth <= 760) app.classList.remove('sidebar-visible');
          });
          const trigger = document.createElement('button');
          trigger.className = 'session-dropdown-trigger';
          trigger.textContent = '•••';
          trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const dropdown = wrapper.querySelector('.session-dropdown');
            document.querySelectorAll('.session-dropdown.show').forEach(d => { if (d !== dropdown) d.classList.remove('show'); });
            dropdown.classList.toggle('show');
          });
          const dropdown = document.createElement('div');
          dropdown.className = 'session-dropdown';
          dropdown.innerHTML = `
            <button class="open-option">Open Chat</button>
            <div class="dropdown-divider"></div>
            <button class="rename-option">Rename</button>
            <button class="delete-option">Delete</button>
          `;
          dropdown.querySelector('.open-option').addEventListener('click', (e) => {
            e.stopPropagation(); openSession(s.session_id); dropdown.classList.remove('show');
            if (window.innerWidth <= 760) app.classList.remove('sidebar-visible');
          });
          dropdown.querySelector('.rename-option').addEventListener('click', (e) => {
            e.stopPropagation();
            openRenameModal(s.session_id, s.title || s.first_message || 'New conversation');
            dropdown.classList.remove('show');
          });
          dropdown.querySelector('.delete-option').addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm('Delete this conversation permanently?')) deleteSession(s.session_id);
            dropdown.classList.remove('show');
          });
          wrapper.appendChild(btn);
          wrapper.appendChild(trigger);
          wrapper.appendChild(dropdown);
          groupDiv.appendChild(wrapper);
        });
        sessionsContainer.appendChild(groupDiv);
      }
      highlightSession(currentSessionId);
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.session-item-wrapper'))
          document.querySelectorAll('.session-dropdown.show').forEach(d => d.classList.remove('show'));
      });
    } catch (err) {
      console.error('❌ Error loading sessions:', err);
      sessionsContainer.innerHTML = `<div style="color:rgba(255,255,255,0.4);font-size:0.85rem;padding:10px;">Error loading sessions</div>`;
    }
  }

  function highlightSession(sessionId) {
    document.querySelectorAll('.session-item-wrapper').forEach(wrapper => {
      const isActive = wrapper.dataset.sessionId === sessionId;
      wrapper.classList.toggle('active', isActive);
      wrapper.querySelector('.session-item').classList.toggle('active', isActive);
    });
  }

  // ─── Open session ──────────────────────────────────────────────
  async function openSession(sessionId) {
    currentSessionId = sessionId;
    highlightSession(sessionId);
    messagesEl.innerHTML = '';
    try {
      const res = await fetch(`/api/sessions/${userData.user_id}/${sessionId}/messages`);
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      const data = await res.json();
      if (!data.messages || data.messages.length === 0) {
        messagesEl.appendChild(emptyState);
        return;
      }
      data.messages.forEach(m => {
        appendUserMessage(m.user_message);
        appendAgentMessage(m.agent_response, {
          sentiment: { label: m.sentiment_label, score: m.sentiment_score },
          intent: m.intent,
          frustration_score: m.frustration,
        }, m.message_id, new Date(m.created_at));
      });
      scrollToBottom();
    } catch (err) {
      console.error('Error loading session:', err);
      messagesEl.appendChild(emptyState);
    }
  }

  // ─── Chat UI helpers ────────────────────────────────────────────
  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
  function ensureEmptyStateRemoved() { if (emptyState.parentNode) emptyState.remove(); }

  function fileIcon(name) {
    const ext = (name||'').split('.').pop().toLowerCase();
    return {pdf:'📄',doc:'📝',docx:'📝',xlsx:'📊',xls:'📊',pptx:'📑',csv:'📊',tsv:'📊',txt:'📃',md:'📃',log:'📃',png:'🖼️',jpg:'🖼️',jpeg:'🖼️',gif:'🖼️',webp:'🖼️'}[ext] || '📎';
  }

  function formatTime(date) {
    if (!date) return '';
    const d = date instanceof Date ? date : new Date(date);
    if (isNaN(d)) return '';
    return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  // ─── Icon SVGs ──────────────────────────────────────────────────
  const ICON_COPY  = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
  const ICON_EDIT  = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
  const ICON_SHARE = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`;

  async function shareText(text, btn) {
    if (navigator.share) {
      try { await navigator.share({ text }); return; } catch(e) {}
    }
    copyText(text, btn);
  }

  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.innerHTML;
      btn.innerHTML = ICON_COPY + ' Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1800);
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    });
  }

  function appendUserMessage(text, attachments, timestamp) {
    ensureEmptyStateRemoved();
    const row = document.createElement('div');
    row.className = 'row user';

    const container = document.createElement('div');
    container.className = 'user-message-container';

    let attHtml = '';
    if (attachments && attachments.length > 0) {
      attHtml = '<div class="bubble-attachment">';
      for (const att of attachments) {
        if (att.type === 'image' && att.dataUrl)
          attHtml += `<img src="${att.dataUrl}" alt="${escapeHtml(att.name)}">`;
        else
          attHtml += `<span class="doc-chip">${fileIcon(att.name)} ${escapeHtml(att.name)}</span>`;
      }
      attHtml += '</div>';
    }

    const timeStr = formatTime(timestamp || new Date());
    const bubbleHtml = `<div class="bubble">${text ? escapeHtml(text) : ''}${attHtml}</div>`;
    const actionsHtml = `
      <div class="msg-actions">
        <span class="msg-time">${timeStr}</span>
        <button class="msg-action-btn user-copy-btn" title="Copy">${ICON_COPY}</button>
        <button class="msg-action-btn user-edit-btn" title="Edit">${ICON_EDIT}</button>
      </div>
    `;
    container.innerHTML = bubbleHtml + actionsHtml;
    row.appendChild(container);
    messagesEl.appendChild(row);

    const bubble = container.querySelector('.bubble');
    const copyBtn = container.querySelector('.user-copy-btn');
    const editBtn = container.querySelector('.user-edit-btn');

    copyBtn.addEventListener('click', () => copyText(text || '', copyBtn));

    editBtn.addEventListener('click', () => {
      const origText = text || '';
      bubble.style.display = 'none';
      const wrap = document.createElement('div');
      wrap.className = 'edit-wrap';
      wrap.innerHTML = `
        <textarea class="edit-area">${escapeHtml(origText)}</textarea>
        <div class="edit-actions">
          <button class="edit-cancel-btn">Cancel</button>
          <button class="edit-save-btn">Send</button>
        </div>`;
      container.insertBefore(wrap, container.querySelector('.msg-actions'));
      const ta = wrap.querySelector('.edit-area');

      ta.style.height = 'auto';
      ta.style.height = Math.max(ta.scrollHeight, 160) + 'px';

      ta.addEventListener('input', () => {
        ta.style.height = 'auto';
        ta.style.height = ta.scrollHeight + 'px';
      });

      ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
      wrap.querySelector('.edit-cancel-btn').addEventListener('click', () => { wrap.remove(); bubble.style.display = ''; });
      wrap.querySelector('.edit-save-btn').addEventListener('click', () => {
        const newText = ta.value.trim();
        if (!newText) return;
        wrap.remove(); bubble.style.display = '';
        bubble.textContent = newText;
        text = newText;
        input.value = newText;
        sendMessage();
        input.value = '';
      });
    });

    scrollToBottom();
  }

  function appendAgentMessage(text, metadata, messageId, timestamp) {
    ensureEmptyStateRemoved();
    const row = document.createElement('div');
    row.className = 'row agent';

    let badgesHtml = '';
    if (metadata) {
      if (metadata.intent) badgesHtml += `<span class="badge">${metadata.intent.replace(/_/g, ' ')}</span>`;
      if (metadata.sentiment?.label) badgesHtml += `<span class="badge sentiment-${metadata.sentiment.label}">${metadata.sentiment.label} sentiment</span>`;
      if (typeof metadata.frustration_score === 'number') badgesHtml += `<span class="badge">frustration ${Math.round(metadata.frustration_score*100)}%</span>`;
    }

    const feedbackHtml = messageId ? `
      <div class="feedback-row">
        <button class="feedback-btn" data-mid="${messageId}" data-helpful="true">👍</button>
        <button class="feedback-btn" data-mid="${messageId}" data-helpful="false">👎</button>
      </div>` : '';

    const timeStr = formatTime(timestamp || new Date());

    const block = document.createElement('div');
    block.className = 'agent-block';
    block.innerHTML = `
      <div class="bubble md-rendered">${renderMarkdown(text)}</div>
      <div class="meta-badges">${badgesHtml}</div>
      ${feedbackHtml}
      <div class="msg-actions">
        <span class="msg-time">${timeStr}</span>
        <button class="msg-action-btn agent-copy-btn" title="Copy">${ICON_COPY}</button>
        <button class="msg-action-btn agent-share-btn" title="Share">${ICON_SHARE}</button>
      </div>`;

    row.appendChild(block);
