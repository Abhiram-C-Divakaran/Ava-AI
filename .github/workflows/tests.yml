name: CI Tests

on:
  push:
    branches: [ main, phase-3-closed-loop-learning ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Static Compilation
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: "dummy_groq_key"
      BRAVE_API_KEY: "dummy_brave_key"
      DEEPL_API_KEY: "dummy_deepl_key"
      REPLICATE_API_KEY: "dummy_replicate_key"
      SECRET_KEY: "dummy_secret_key_for_testing"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static compilation check
        run: |
          python -m py_compile main.py database.py memory.py adaptation.py powers.py llm.py MLpipeline.py

      - name: Run adaptation test suite
        run: |
          python -m unittest test_adaptation.py -v
